<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Platform</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <h1>StorySpace</h1>
        <div class="auth-actions">
          <span id="welcome" class="welcome hidden"></span>
          <button id="logoutBtn" class="button secondary hidden">Logout</button>
        </div>
      </div>
    </header>

    <main class="container layout">
      <aside class="panel auth-panel">
        <h2>Account</h2>

        <div id="authForms">
          <form id="registerForm" class="stacked-form">
            <h3>Register</h3>
            <input type="text" id="registerUsername" placeholder="Username" required />
            <input type="password" id="registerPassword" placeholder="Password" required />
            <button type="submit" class="button">Create account</button>
          </form>

          <form id="loginForm" class="stacked-form">
            <h3>Login</h3>
            <input type="text" id="loginUsername" placeholder="Username" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit" class="button primary">Login</button>
          </form>
        </div>
      </aside>

      <section class="content">
        <form id="postForm" class="panel composer hidden">
          <h2 id="postFormTitle">Write a post</h2>
          <input type="text" id="postTitle" placeholder="Post title" required />
          <textarea id="postContent" rows="6" placeholder="Write your story..." required></textarea>
          <div class="form-actions">
            <button type="submit" class="button primary">Publish</button>
            <button type="button" id="cancelEditBtn" class="button secondary hidden">Cancel</button>
          </div>
        </form>

        <div class="panel">
          <div class="section-header">
            <h2>Latest Posts</h2>
          </div>
          <div id="posts" class="posts"></div>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
